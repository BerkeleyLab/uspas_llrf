[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "uspas_llrf"
version = "0.1.0"
authors = [
  {name = "Qiang Du", email = "QDu@lbl.gov"},
  {name = "Lawrence Doolittle", email = "LRDoolittle@lbl.gov"},
  {name = "Shreeharshini Murthy", email = "SDMurthy@lbl.gov"}
]
description = "Digital LLRF Firmware Suite for USPAS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cocotb==2.0.1",
    "cocotb-bus==0.3.0",
    "numpy>=2.2.4",
    "pandas>=3.0.0",
    "pyserial>=3.5",
    "scipy>=1.15.3",
    "leep==1.0.0"
]
license = "LicenseRef-Government-Use"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://gitlab.lbl.gov/uspas-llrf/uspas_llrf"

[tool.setuptools.packages.find]
where = ["."]
include = ["uspas_llrf"]
