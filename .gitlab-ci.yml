stages:
  - test
  - synthesis
  - run

variables:
  XILINX_VIVADO: /non-free/Xilinx/Vivado_and_Vitis/2022.1/Vivado/2022.1
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  GIT_SUBMODULE_STRATEGY: normal
  MARBLE_SERIAL: 42

image: mohs.dhcp.lbl.gov/xilinx_env_trixie_custom_verilator

flake8_check:
  stage: test
  script:
   - flake8

llrf_dsp_test:
  before_script:
    - pip install -e .
    - cd llrf_dsp
  stage: test
  script:
    - make FSET=${TARGET} COCOTB_RANDOM_SEED=1774201716
  parallel:
    matrix:
      # - TARGET: [ALSU, USPAS, LEMP, AWA]
      - TARGET: [USPAS]

llrf_cdc_test:
  before_script:
    - cd llrf_dsp
  stage: test
  script:
    - make llrf_shell_expand.v && make llrf_shell_cdc.txt
  artifacts:
    when: always
    paths:
      - llrf_dsp/llrf_shell_cdc.txt

marble_bsp_test:
  before_script:
    - cd marble_bsp
  stage: test
  script:
    - make

soc_system_test:
  before_script:
    - pip install -e .
    - cd soc/marble_zest/sim
  stage: test
  script:
    - PATH=$XILINX_VIVADO/bin:$PATH make

soc_system_top_test:
  before_script:
    - pip install -e .
    - cd soc/marble_zest/top_sim
  stage: test
  script:
    - PATH=$XILINX_VIVADO/bin:$PATH make

soc_synthesis:
  before_script:
    - pip install -e .
    - cd soc/marble_zest/synth
  stage: synthesis
  script:
    - PATH=$XILINX_VIVADO/bin:$PATH make
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    expire_in: 2 days
    paths:
      - soc/marble_zest/synth/*.bit
      - soc/marble_zest/synth/_xilinx/*.runs/impl_1/*.rpt

llrf_synthesis:
  before_script:
    - pip install -e .
    - cd top/marble_zest
  stage: synthesis
  script:
    - PATH=$XILINX_VIVADO/bin:$PATH make FSET=${TARGET}
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    expire_in: 2 days
    paths:
      - top/marble_zest/*.bit
      - top/marble_zest/*.bin
      - top/marble_zest/_xilinx/*.runs/impl_1/*.rpt
  parallel:
    matrix:
      - TARGET: [ALSU, USPAS, LEMP, AWA]

alsu_run:
  variables:
    EVG_F: 125.1e6
    CLK_F: 458.7e6
  before_script:
    - pip install -e .
    - python3 -m uspas_llrf.tools.erasynth_micro -p /dev/ttyACM4 -f ${EVG_F}  # EVG ref
    - python3 -m uspas_llrf.tools.dual_evg -r
    - sleep 10
    - python3 -m uspas_llrf.tools.erasynth_micro -p /dev/ttyACM5 -f ${CLK_F}  # CLK ref
    - cd top/marble_zest
  stage: run
  tags:
    - deploy
  resource_group: hw_uspas
  needs:
    - job: llrf_synthesis
      parallel:
        matrix:
          - TARGET: ALSU
  script:
    - make system_config MARBLE_SERIAL=${MARBLE_SERIAL} FSET=ALSU
    - sleep 8
    - make system_test MARBLE_SERIAL=${MARBLE_SERIAL}

