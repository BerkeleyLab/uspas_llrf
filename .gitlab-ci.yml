stages:
  - test
  - test_designs
  - synthesis
  - run

variables:
  XILINX_VIVADO: /non-free/Xilinx/Vivado_and_Vitis/2022.1/Vivado/2022.1
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  GIT_SUBMODULE_STRATEGY: normal
  MARBLE_SERIAL: 42

image: mohs.dhcp.lbl.gov/xilinx_env_trixie_custom_verilator

default:
  before_script:
    - export PATH=$XILINX_VIVADO/bin:$PATH
    - apt update
    - apt install -y python3-venv
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install -e .

flake8_check:
  stage: test
  script:
   - flake8 uspas_llrf llrf_dsp/tests

llrf_dsp_test:
  stage: test
  script:
    - cd llrf_dsp
    - make

llrf_cdc_test:
  stage: test
  script:
    - cd designs/uspas
    - make llrf_shell_expand.v && make llrf_shell_cdc.txt
  artifacts:
    when: always
    paths:
      - designs/uspas/llrf_shell_cdc.txt

marble_bsp_test:
  stage: test
  script:
    - cd marble_bsp
    - make

llrf_shell_test:
  stage: test_designs
  script:
    - cd designs
    - make -C ${TARGET}/tb/llrf_shell
  parallel:
    matrix:
      - TARGET: [alsu, uspas, lemp, awa]

soc_system_test:
  stage: test
  script:
    - cd soc/marble_zest/sim
    - make

soc_system_top_test:
  stage: test
  script:
    - cd soc/marble_zest/top_sim
    - make

soc_synthesis:
  stage: synthesis
  script:
    - cd soc/marble_zest/synth
    - make
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    expire_in: 2 days
    paths:
      - soc/marble_zest/synth/*.bit
      - soc/marble_zest/synth/_xilinx/*.runs/impl_1/*.rpt

llrf_synthesis:
  stage: synthesis
  script:
    - cd top/marble_zest
    - make DESIGN=${TARGET}
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    expire_in: 2 days
    paths:
      - top/marble_zest/*.bit
      - top/marble_zest/_xilinx/*.runs/impl_1/*.rpt
  parallel:
    matrix:
      - TARGET: [alsu, uspas, lemp, awa]

alsu_run:
  variables:
    EVG_F: 125.1e6
    CLK_F: 458.7e6
  stage: run
  tags:
    - deploy
  resource_group: hw_uspas
  needs:
    - job: llrf_synthesis
      parallel:
        matrix:
          - TARGET: alsu
  script:
    - python3 -m uspas_llrf.tools.erasynth_micro -p /dev/ttyACM4 -f ${EVG_F}  # EVG ref
    - python3 -m uspas_llrf.tools.dual_evg -r
    - sleep 10
    - python3 -m uspas_llrf.tools.erasynth_micro -p /dev/ttyACM5 -f ${CLK_F}  # CLK ref
    - cd top/marble_zest
    - make system_config MARBLE_SERIAL=${MARBLE_SERIAL} DESIGN=alsu
    - sleep 8
    - make system_test MARBLE_SERIAL=${MARBLE_SERIAL}

awa_run:
  variables:
    CLK_F: 1320e6
  stage: run
  tags:
    - deploy
  resource_group: hw_uspas
  needs:
    - job: llrf_synthesis
      parallel:
        matrix:
          - TARGET: awa
  script:
    - python3 -m uspas_llrf.tools.erasynth_micro -p /dev/ttyACM5 -f ${CLK_F}  # CLK ref
    - cd top/marble_zest
    - make system_config MARBLE_SERIAL=${MARBLE_SERIAL} DESIGN=awa
    - sleep 8
    - make system_test MARBLE_SERIAL=${MARBLE_SERIAL}

lemp_run:
  variables:
    EVG_F: 119e6
    CLK_F: 2856e6
  stage: run
  tags:
    - deploy
  resource_group: hw_uspas
  needs:
