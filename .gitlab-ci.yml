      parallel:
        matrix:
          - TARGET: lemp
  script:
    - python3 -m uspas_llrf.tools.erasynth_micro -p /dev/ttyACM4 -f ${EVG_F}  # EVG ref
    - python3 -m uspas_llrf.tools.dual_evg -r
    - sleep 10
    - python3 -m uspas_llrf.tools.erasynth_micro -p /dev/ttyACM5 -f ${CLK_F}  # CLK ref
    - cd top/marble_zest
    - make system_config MARBLE_SERIAL=${MARBLE_SERIAL} DESIGN=lemp
    - sleep 8
    - make system_test MARBLE_SERIAL=${MARBLE_SERIAL}

uspas_run:
  variables:
    CLK_F: 460e6
  stage: run
  tags:
    - deploy
  resource_group: hw_uspas
  needs:
    - job: llrf_synthesis
      parallel:
        matrix:
          - TARGET: uspas
  script:
    - python3 -m uspas_llrf.tools.erasynth_micro -p /dev/ttyACM5 -f ${CLK_F}  # CLK ref
    - cd top/marble_zest
    - make system_config MARBLE_SERIAL=${MARBLE_SERIAL} DESIGN=uspas
    - sleep 8
    - make system_test MARBLE_SERIAL=${MARBLE_SERIAL}
