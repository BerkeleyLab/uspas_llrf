stages:
  - test
  - synthesis
  - run

variables:
  XILINX_VIVADO: /non-free/Xilinx/Vivado/2020.2
  CI_REGISTRY: mohs.dhcp.lbl.gov
  CONTAINER_IMAGE: $CI_REGISTRY/testing_base_bookworm
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  GIT_SUBMODULE_STRATEGY: normal

image: $CONTAINER_IMAGE:master

flake8:
  stage: test
  script:
   - flake8 python/*.py llrf_dsp/regmap/*.py llrf_dsp/scripts/*.py llrf_dsp/tests/*.py

llrf_dsp_test:
  before_script:
    - cd llrf_dsp
  stage: test
  script:
    - make clean && make FSET=${TARGET}
  parallel:
    matrix:
      - TARGET: [ALSU, USPAS, LEMP, AWA]

cocotb_dsp_test:
  before_script:
    - apt-get install verilator
    - pip install numpy scipy cocotb==1.9.1 pytest
    - cd llrf_dsp/tests
  stage: test
  script:
    # See https://docs.cocotb.org/en/stable/building.html
    # and our issue #15
    - make RANDOM_SEED=1724518460

llrf_cdc_test:
  before_script:
    - cd llrf_dsp
  stage: test
  script:
    - make clean && make llrf_shell_expand.v && make llrf_shell_cdc.txt
  artifacts:
    when: always
    paths:
      - llrf_dsp/llrf_shell_cdc.txt

marble_bsp_test:
  before_script:
    - cd marble_bsp
  stage: test
  script:
    - make

marble_zest_synth:
  before_script:
    - cd top/marble_zest
  stage: synthesis
  script:
    - make clean && PATH=$XILINX_VIVADO/bin:$PATH make FSET=${TARGET}
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
    expire_in: 2 days
    paths:
      - top/marble_zest/*.bit
      - top/marble_zest/*.bin
      - top/marble_zest/_xilinx/*.runs/impl_1/*.rpt
  parallel:
    matrix:
      - TARGET: [ALSU, USPAS, LEMP, AWA]

.marble_lemp_run:
  before_script:
    - pip install pandas
    - cd top/marble_zest
  stage: run
  tags:
    - deploy
  needs:
  - job: marble_zest_synth
    parallel:
      matrix:
        - PLATFORM: LEMP
  script:
    - make system_config MARBLE_SERIAL=42 FSET=LEMP && sleep 4 && make system_test MARBLE_SERIAL=42

marble_awa_run:
  before_script:
    - pip install pandas
    - cd top/marble_zest
  stage: run
  tags:
    - deploy
  needs:
  - job: marble_zest_synth
    parallel:
      matrix:
        - PLATFORM: AWA
  script:
    - make system_config MARBLE_SERIAL=39 FSET=AWA && sleep 4 && make system_test MARBLE_SERIAL=39

marble_uspas_run:
  before_script:
    - pip install pandas
    - cd top/marble_zest
  stage: run
  tags:
    - deploy
  needs:
  - job: marble_zest_synth
    parallel:
      matrix:
        - PLATFORM: USPAS
  script:
    - make system_config MARBLE_SERIAL=42 FSET=USPAS && sleep 4 && make system_test MARBLE_SERIAL=42